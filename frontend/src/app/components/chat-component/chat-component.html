<div class="chat-container">
  <h2>PoC Chat Support</h2>

  <div class="messages-list" style="border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px;">
    <div *ngFor="let msg of messages()">
        <strong>{{ msg.sender }} :</strong> {{ msg.content }}
    </div>
  </div>

  <div class="input-box" style="margin-top: 10px;">
    <input 
      type="text" 
      [(ngModel)]="messageContent" 
      placeholder="Tapez votre message..." 
      (keyup.enter)="send()"
    />
    <button (click)="send()" [disabled]="!messageContent.trim()">Envoyer</button>
  </div>
</div>
